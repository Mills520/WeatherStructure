plugins {
    id 'java-library'
}

group   = maven_group
version = mod_version

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release  = 21
    // The engine is the one module that builds on a plain JDK, so it is also the
    // one place lint is cheap to enforce. `this-escape` is excluded because it
    // fires on the enum constructors in BiomeCategory.
    options.compilerArgs << "-Xlint:all,-this-escape"
}

dependencies {
    testImplementation         libs.junit.jupiter
    // Gradle 9 no longer ships the JUnit Platform launcher implicitly; declare
    // it explicitly so `useJUnitPlatform()` can start the test executor.
    testRuntimeOnly            libs.junit.platform.launcher
}

tasks.named('test') {
    useJUnitPlatform()
}
