pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { name = "Fabric";   url = "https://maven.fabricmc.net/" }
        maven { name = "NeoForge"; url = "https://maven.neoforged.net/releases/" }
        mavenCentral()
    }
}

dependencyResolutionManagement {
    repositories {
        gradlePluginPortal()
        // WSM intermediary override (must come BEFORE the Fabric maven). The
        // fabric build.gradle stages a synthesized 3-namespace intermediary
        // jar here at the correct GAV with a properly versioned POM, so
        // Loom's internal `net.fabricmc:intermediary:<ver>` resolution
        // (separate from the `mappings` configuration) picks up our jar
        // instead of Fabric's upstream 2-column file. Without this, Loom
        // dies with "Could not find 'named' mapping position!" even when
        // the user-facing mappings dep has all 3 namespaces.
        maven {
            name = "WSM-Intermediary-Override"
            url = "${gradle.gradleUserHomeDir}/wsm-local-maven"
            content { includeModule("net.fabricmc", "intermediary") }
        }
        // Upstream Fabric intermediary fallback. The published jar's POM is
        // hard-coded to <version>0.0.0</version>, which Gradle's strict
        // metadata check rejects — use artifact-derived metadata to bypass.
        maven {
            name = "Fabric-Intermediary"
            url = "https://maven.fabricmc.net/"
            metadataSources { artifact() }
            content { includeModule("net.fabricmc", "intermediary") }
        }
        maven {
            name = "Fabric"
            url = "https://maven.fabricmc.net/"
            content { excludeModule("net.fabricmc", "intermediary") }
        }
        maven { name = "NeoForge"; url = "https://maven.neoforged.net/releases/" }
        maven { name = "PaperMC";  url = "https://repo.papermc.io/repository/maven-public/" }
        mavenCentral()
    }
}

rootProject.name = 'weather-structure-multimod'

include 'common'
include 'fabric'
include 'neoforge'
include 'paper'
