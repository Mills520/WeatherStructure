pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { name = "Fabric";   url = "https://maven.fabricmc.net/" }
        maven { name = "NeoForge"; url = "https://maven.neoforged.net/releases/" }
        mavenCentral()
    }
}

dependencyResolutionManagement {
    repositories {
        gradlePluginPortal()
        // Fabric's intermediary artifact ships with a stub POM declaring
        // <version>0.0.0</version>, which Gradle's strict module-metadata
        // check rejects when you request a real version. Pin a dedicated
        // repo entry that only handles the intermediary module and uses
        // artifact-derived metadata, so the bad POM is bypassed.
        maven {
            name = "Fabric-Intermediary"
            url = "https://maven.fabricmc.net/"
            metadataSources { artifact() }
            content { includeModule("net.fabricmc", "intermediary") }
        }
        maven {
            name = "Fabric"
            url = "https://maven.fabricmc.net/"
            content { excludeModule("net.fabricmc", "intermediary") }
        }
        maven { name = "NeoForge"; url = "https://maven.neoforged.net/releases/" }
        maven { name = "PaperMC";  url = "https://repo.papermc.io/repository/maven-public/" }
        mavenCentral()
    }
}

rootProject.name = 'weather-structure-multimod'

// Forge is a standalone subproject with its own Gradle 8.8 wrapper.
// It is built separately by build-all.sh / build-all.bat.
// DO NOT include 'forge' here — ForgeGradle 6 requires Gradle 8 and
// is incompatible with the Gradle 9.2 used by Loom 1.14 and ModDevGradle 2.

// Conditionally include each MC line so Gradle doesn't *configure* the
// 26.x projects under Java 21 (Loom 1.15 fails its Java 25 check during
// configuration even if those projects aren't on the requested task list).
//
// Set -Dwsm.line=1.21 to include only the 1.21.x line, -Dwsm.line=26x to
// include only the 26.x line, or leave unset / use 'all' to include both
// (works only if the running Gradle JVM is Java 25, since Loom 1.15 needs
// it for the 26.x configuration step).
def wsmLine = (System.getProperty('wsm.line') ?: 'all').toLowerCase()

include 'common'

if (wsmLine == '1.21' || wsmLine == 'all') {
    include 'fabric'
    include 'neoforge'
    include 'paper'
}

if (wsmLine == '26x' || wsmLine == 'all') {
    include 'fabric-26x'
    include 'neoforge-26x'
    include 'paper-26x'
}
