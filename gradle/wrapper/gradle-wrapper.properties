distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-9.2.0-bin.zip
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists

# RECOMMENDED: pin the distribution's SHA-256 here.
#
# ./gradlew and gradlew.bat refuse to install a distribution they cannot verify.
# With this property set they compare the download against it and abort on
# mismatch — that is the control that stops a tampered or MITM'd Gradle from
# executing on a developer machine or in CI. Without it they fall back to the
# publisher's `<distributionUrl>.sha256`, which catches corruption but not an
# attacker who controls that origin.
#
# Take the value for gradle-9.2.0-bin.zip from
# https://gradle.org/release-checksums/ and uncomment:
# distributionSha256Sum=<64-hex-digest-from-gradle.org>
