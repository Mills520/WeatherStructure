[versions]
# All Minecraft/Fabric/NeoForge/Paper version pins live in gradle.properties
# (and are referenced via ${name} in each subproject's build.gradle) so the
# build script and the build files can read them from the same place.
# This catalog only holds the JVM-side test deps that common/ uses.
junit = "5.11.4"

[libraries]
junit-jupiter           = { module = "org.junit.jupiter:junit-jupiter",            version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
