org.gradle.jvmargs=-Xmx2G -Xms256m

# ── Shared ──────────────────────────────────────────────────────────────
mod_version     = 1.6.0
maven_group     = com.example
mod_id          = weatherstructuremod

# ── Minecraft 26.x line ─────────────────────────────────────────────────
# Yarn was retired after MC 1.21.11 (the last obfuscated MC version), so
# from 26.x onward all platforms compile against the unobfuscated game
# jar. The Fabric build still uses Fabric's intermediary mappings for
# runtime classloading — see fabric/build.gradle for the workaround.
minecraft_version = 26.1.2

# ── Fabric ──────────────────────────────────────────────────────────────
fabric_loader = 0.19.2
fabric_api    = 0.149.0+26.1.2
fabric_loom   = 1.15-SNAPSHOT

# ── NeoForge ────────────────────────────────────────────────────────────
# Maven-style dynamic version: Gradle picks the highest 26.1.x release
# published to https://maven.neoforged.net/releases/. NeoForge's MC 26.x
# numbering is in flux (the original `26.1.0-beta` pin from v1.5.0 has
# been unpublished/replaced), so a wildcard is safer than chasing the
# moving target. Once NeoForge stabilizes on a release for MC 26.1.x,
# pin it exactly here for reproducibility.
neoforge_version     = 26.1.+
moddevgradle_version = 2.0.140

# ── Paper / Spigot ──────────────────────────────────────────────────────
paper_api = 26.1.2-R0.1-SNAPSHOT

# Disable Gradle toolchain auto-provision. build-all.sh / build-all.bat
# explicitly pass -Dorg.gradle.java.home to point at JDK 25 (MC 26.x
# requires Java 25 for the Loom/ModDevGradle configuration step).
org.gradle.java.installations.auto-detect=false
org.gradle.java.installations.auto-provision=false
