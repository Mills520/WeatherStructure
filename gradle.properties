org.gradle.jvmargs=-Xmx2G -Xms256m

# ── Shared ──────────────────────────────────────────────────────────────
mod_version     = 1.6.0
maven_group     = com.example
mod_id          = weatherstructuremod

# ── Minecraft 26.x line ─────────────────────────────────────────────────
# Yarn was retired after MC 1.21.11 (the last obfuscated MC version), so
# from 26.x onward all platforms compile against the unobfuscated game
# jar. The Fabric build still uses Fabric's intermediary mappings for
# runtime classloading — see fabric/build.gradle for the workaround.
minecraft_version = 26.1.2

# ── Fabric ──────────────────────────────────────────────────────────────
fabric_loader = 0.19.2
fabric_api    = 0.149.0+26.1.2
fabric_loom   = 1.15-SNAPSHOT

# ── NeoForge ────────────────────────────────────────────────────────────
# Must be a concrete published version: NeoForm Runtime (NFRT, invoked
# by ModDevGradle's :neoforge:createMinecraftArtifacts task) builds the
# `neoforge-<ver>-userdev.jar` download URL by literal string
# substitution. Gradle dynamic ranges like `26.1.+` are not expanded.
#
# NeoForge's 26.1.x branch publishes every push as `26.1.2.N-beta`
# where N is the number of commits since the `26.1.2` tag (see
# neoforged/action-tag-versioning, `increment_last_version_component:
# false` + `version_labels: -beta, -stable` in NeoForge's release.yml).
# The plain `26.1.2` tag does NOT exist as a maven artifact.
#
# To bump, check the latest version at:
#   https://maven.neoforged.net/api/maven/details/releases/net/neoforged/neoforge
neoforge_version     = 26.1.2.59-beta
moddevgradle_version = 2.0.140

# ── Paper / Spigot ──────────────────────────────────────────────────────
# Paper hasn't published an MC 26.x build to repo.papermc.io yet (latest
# release tag in PaperMC/Paper is `1.21.11`; their main branch is wired
# for 26.1.2 but no snapshot has shipped). We compile against the latest
# available paper-api — Bukkit API is forward-compatible, so the jar
# loads cleanly on Paper 26.1.x once the runtime ships. The plugin's
# 26.1 runtime target lives in paper/src/main/resources/plugin.yml
# (`api-version: '26.1'`), not here.
# Bump to `26.1.x-R0.1-SNAPSHOT` once https://repo.papermc.io carries it.
paper_api = 1.21.11-R0.1-SNAPSHOT

# Disable Gradle toolchain auto-provision. build-all.sh / build-all.bat
# explicitly pass -Dorg.gradle.java.home to point at JDK 25 (MC 26.x
# requires Java 25 for the Loom/ModDevGradle configuration step).
org.gradle.java.installations.auto-detect=false
org.gradle.java.installations.auto-provision=false
