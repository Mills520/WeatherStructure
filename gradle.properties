org.gradle.jvmargs=-Xmx2G -Xms256m

# ── Shared ──────────────────────────────────────────────────────────────
mod_version     = 1.5.0
maven_group     = com.example
mod_id          = weatherstructuremod
minecraft_version = 1.21.11

# ── Fabric (1.21.x) ─────────────────────────────────────────────────────
# Yarn is FINAL for 1.21.11 (last obfuscated version)
yarn_mappings    = 1.21.11+build.3
fabric_loader    = 0.18.4
fabric_api       = 0.141.3+1.21.11
fabric_loom      = 1.14-SNAPSHOT

# ── NeoForge (1.21.x) ───────────────────────────────────────────────────
# Check latest at: https://projects.neoforged.net/neoforged/neoforge
# Format: 21.11.X-beta   (X = build number, increases weekly)
neoforge_version = 21.11.0-beta
moddevgradle_version = 2.0.140

# ── Paper (1.21.x) ──────────────────────────────────────────────────────
paper_api = 1.21.11-R0.1-SNAPSHOT

# ── 26.1.x line ─────────────────────────────────────────────────────────
# These are best-guess starting points; verify exact versions exist on the
# relevant maven repositories and adjust if the first build fails.
minecraft_version_26x = 26.1.2
# Fabric uses mojang official mappings from 26.x onward (no yarn).
fabric_loader_26x     = 0.19.2
fabric_api_26x        = 0.149.0+26.1.2
# Loom version supporting MC 26.x — bump if the 1.15-SNAPSHOT line is wrong.
fabric_loom_26x       = 1.15-SNAPSHOT
# NeoForge for MC 26.1.x — follows the same major.minor convention as MC.
neoforge_version_26x  = 26.1.0-beta
paper_api_26x         = 26.1.2-R0.1-SNAPSHOT

# Disable Gradle toolchain auto-provision. build-all.sh / build-all.bat
# explicitly pass -Dorg.gradle.java.home for the correct JDK per step
# (Java 21 for the 1.21.x line + Forge, Java 25 for the 26.1.x line).
org.gradle.java.installations.auto-detect=false
org.gradle.java.installations.auto-provision=false
