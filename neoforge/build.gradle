plugins {
    id 'net.neoforged.moddev' version "${moddevgradle_version}"
}

version   = "${mod_version}"
group     = maven_group
base { archivesName = "weather-structure-mod-neoforge" }

neoForge {
    version = "${neoforge_version}"

    mods {
        weatherstructuremod {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    implementation project(':common')
    // No `{ version { ... } }` block here. A project dependency has no version
    // DSL, so Groovy resolved that call against the enclosing project instead and
    // set *this project's* version to the closure — the jar shipped as
    // weather-structure-mod-neoforge-build_…$_closure10@<hash>.jar. ModDevGradle
    // derives the jar-in-jar range ("[<common version>,)") from the project itself.
    jarJar project(':common')
}

def targetJava = 25
tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release  = targetJava
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
}

jar {
    manifest {
        attributes(["MixinConfigs": "weatherstructuremod-neoforge.mixins.json"])
    }
    from("${rootProject.projectDir}/LICENSE") {
        rename { "${it}_${base.archivesName.get()}" }
    }
}
