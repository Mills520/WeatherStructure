plugins {
    id 'java'
}

version = "${mod_version}"
group   = maven_group
base { archivesName = "weather-structure-mod-paper-26x" }

// Share the Bukkit plugin source with the 1.21.x Paper module — the plugin
// uses only stable Bukkit APIs and Paper-NMS reflection by class name, both
// of which are unchanged between MC 1.21.x and 26.1.x.
sourceSets.main.java.srcDirs += '../paper/src/main/java'

dependencies {
    compileOnly "io.papermc.paper:paper-api:${paper_api_26x}"

    implementation project(':common')
}

def targetJava = 21
tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release  = targetJava
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    from("${rootProject.projectDir}/LICENSE") {
        rename { "${it}_${base.archivesName.get()}" }
    }
    from(project(':common').sourceSets.main.output)
}

processResources {
    inputs.property "version", project.version
    filteringCharset "UTF-8"
    filesMatching("plugin.yml") { expand "version": project.version }
}
