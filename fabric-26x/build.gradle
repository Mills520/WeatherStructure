plugins {
    id 'fabric-loom' version "${fabric_loom_26x}"
}

version   = "${mod_version}"
group     = maven_group
base { archivesName = "weather-structure-mod-fabric-26x" }

// ── Fabric intermediary workaround ─────────────────────────────────────────
// MC 26.x ships pre-deobfuscated (yarn was final at 1.21.11, the last
// obfuscated MC version). Mojang no longer publishes a `client_mappings`
// file, so `loom.officialMojangMappings()` fails with
//   "Failed to find official mojang mappings for 26.1.2"
//
// Fabric publishes intermediary mappings for 26.1.x, but the artifact
// ships with a stub POM whose <version> is hard-coded to 0.0.0. Gradle's
// strict module-metadata verification rejects the mismatch:
//   "inconsistent module metadata found. Descriptor: ...:0.0.0
//    Errors: bad version: expected='26.1.2' found='0.0.0'"
//
// `@jar` artifact-only notation and `metadataSources { artifact() }` on a
// dedicated repo entry both failed to suppress this — Loom's internal
// mappings resolution path appears to re-declare intermediary in a way
// that triggers POM lookup anyway.
//
// Bulletproof fix: download the jar ourselves and feed it to Loom as a
// local file dependency. `files(...)` skips every metadata mechanism.
def intermediaryDir  = file("${gradle.gradleUserHomeDir}/wsm-intermediary-cache/${minecraft_version_26x}")
def intermediaryJar  = new File(intermediaryDir, "intermediary-${minecraft_version_26x}-v2.jar")
if (!intermediaryJar.exists()) {
    intermediaryDir.mkdirs()
    // Fabric's intermediary maven layout has changed across MC versions:
    //   pre-1.21.x:  intermediary-VER-v2.jar (classifier "v2")
    //   post-1.21.x: intermediary-VER.jar    (no classifier; v2 format is default)
    // The Prism runtime log for MC 26.1.2 showed the no-classifier filename,
    // so try that first and fall back to the older classifier layout.
    def base = "https://maven.fabricmc.net/net/fabricmc/intermediary/${minecraft_version_26x}"
    def candidates = [
        "${base}/intermediary-${minecraft_version_26x}.jar",
        "${base}/intermediary-${minecraft_version_26x}-v2.jar",
    ]
    def tmp     = new File(intermediaryDir, "intermediary.jar.part")
    def errors  = []
    def sourceUrl = null
    for (url in candidates) {
        try {
            def conn = new URL(url).openConnection()
            conn.setRequestProperty('User-Agent', 'wsm-build/1.5.0')
            conn.setConnectTimeout(30_000)
            conn.setReadTimeout(60_000)
            def code = conn.getResponseCode()
            if (code != 200) {
                errors << "${code} ${url}"
                continue
            }
            println "[fabric-26x] downloading intermediary: ${url}"
            conn.inputStream.withStream { input ->
                tmp.withOutputStream { output -> output << input }
            }
            sourceUrl = url
            break
        } catch (Throwable t) {
            errors << "${t.class.simpleName}: ${t.message} (${url})"
        }
    }
    if (sourceUrl == null) {
        tmp.delete()
        throw new GradleException(
            "[fabric-26x] could not download Fabric intermediary mappings for " +
            "${minecraft_version_26x}. Tried:\n  - " + errors.join('\n  - '))
    }
    try {
        // java.nio.Files.move throws on failure (unlike File.renameTo which
        // silently returns false on Windows AV / file-lock interference).
        java.nio.file.Files.move(
            tmp.toPath(),
            intermediaryJar.toPath(),
            java.nio.file.StandardCopyOption.REPLACE_EXISTING
        )
    } catch (Throwable t) {
        tmp.delete()
        intermediaryJar.delete()
        throw new GradleException(
            "[fabric-26x] failed to install intermediary jar at " +
            "${intermediaryJar}: ${t.message}", t)
    }
    if (!intermediaryJar.exists()) {
        throw new GradleException(
            "[fabric-26x] intermediary jar missing after download: ${intermediaryJar}")
    }
    println "[fabric-26x] saved: ${intermediaryJar}"
}

// ── Synthesize the 'named' namespace ───────────────────────────────────────
// Post-yarn intermediary jars contain only two namespaces (`intermediary`,
// `official`); Loom requires a third (`named`) for compiling source. Yarn
// used to fill that slot; nothing does now. Since MC 26.x is unobfuscated,
// `named == official` is the correct mapping, so we transform the tinyv2
// file in-place by adding a 'named' column that mirrors 'official'.
//
// Tinyv2 grammar (https://fabricmc.net/wiki/documentation:tinyv2):
//   header:  tiny<TAB>2<TAB>0<TAB><ns0><TAB><ns1>[<TAB><ns2>...]
//   class:   c<TAB><name0><TAB><name1>...
//   field:   <TAB>f<TAB><desc><TAB><name0><TAB><name1>...
//   method:  <TAB>m<TAB><desc><TAB><name0><TAB><name1>...
//   param:   <TAB><TAB>p<TAB><lvIdx><TAB><name0>...
//   var:     <TAB><TAB>v<TAB><lvIdx><TAB><off>[<TAB><lvtIdx>]<TAB><name0>...
//   anything else (comments `#...`, indented child blocks of c-headers
//   like `\tc` for class comments) is left untouched.
def mappingsJar = new File(intermediaryDir, "intermediary-${minecraft_version_26x}-with-named.jar")
if (!mappingsJar.exists()) {
    println "[fabric-26x] synthesizing 'named' namespace from intermediary…"
    def src = new java.util.zip.ZipFile(intermediaryJar)
    try {
        def entry = src.getEntry('mappings/mappings.tiny')
        if (entry == null) {
            throw new GradleException(
                "[fabric-26x] ${intermediaryJar} has no mappings/mappings.tiny")
        }
        def tiny
        src.getInputStream(entry).withCloseable { input ->
            tiny = input.getText('UTF-8')
        }
        def out = new StringBuilder(tiny.length() + tiny.length() / 2 as int)
        boolean headerSeen = false
        boolean passthrough = false
        tiny.eachLine { line ->
            if (!headerSeen && line.startsWith('tiny\t')) {
                // Header columns: tiny, 2, 0, ns0, ns1[, ns2, ...]
                def parts = line.split('\t', -1)
                def namespaces = parts.length > 3 ? parts[3..-1] : []
                if (namespaces.contains('named')) {
                    // Header already includes a `named` namespace — Loom will
                    // pick that as the source-side mapping and no synthesis is
                    // needed. Stream the file through unchanged.
                    passthrough = true
                    out.append(line).append('\n')
                } else {
                    // Append `named` as the new last column. Every subsequent
                    // data line will get a duplicate of its current last
                    // column appended to fill the slot.
                    out.append(line).append('\tnamed').append('\n')
                }
                headerSeen = true
            } else if (passthrough) {
                out.append(line).append('\n')
            } else if (line.startsWith('c\t')
                       || line.startsWith('\tm\t') || line.startsWith('\tf\t')
                       || line.startsWith('\t\tp\t') || line.startsWith('\t\tv\t')) {
                // Mapping data row — append a copy of the last namespace column.
                def parts = line.split('\t', -1)
                def last = parts.length > 0 ? parts[parts.length - 1] : ''
                out.append(line).append('\t').append(last).append('\n')
            } else {
                // Comments, child blocks (\tc), blank lines — passthrough.
                out.append(line).append('\n')
            }
        }
        def tmpJar = new File(intermediaryDir, "intermediary-named.jar.part")
        def zos = new java.util.zip.ZipOutputStream(new FileOutputStream(tmpJar))
        try {
            zos.putNextEntry(new java.util.zip.ZipEntry('mappings/mappings.tiny'))
            zos.write(out.toString().getBytes('UTF-8'))
            zos.closeEntry()
        } finally {
            zos.close()
        }
        java.nio.file.Files.move(
            tmpJar.toPath(),
            mappingsJar.toPath(),
            java.nio.file.StandardCopyOption.REPLACE_EXISTING
        )
        println "[fabric-26x] wrote: ${mappingsJar}"
    } finally {
        src.close()
    }
}

// ── Stage synthesized jar as a local maven artifact ────────────────────────
// Loom independently resolves `net.fabricmc:intermediary:<ver>` when setting
// up its runtime remap pipeline, *separately* from the `mappings files(...)`
// dep below. That separate resolution still goes through Fabric's maven and
// reads the 2-column intermediary jar, which is why Loom keeps failing on
//   Could not find 'named' mapping position!
// even though our `mappings files(...)` dep has all 3 columns.
//
// Stage the synthesized jar in a local maven repo at the correct GAV with a
// POM that declares the right version (the upstream POM is hard-coded to
// 0.0.0). settings.gradle adds this dir as a repo *before* maven.fabricmc.net
// for the intermediary module specifically, so Loom's internal fetch picks
// up our 3-column jar.
def localMavenRoot = file("${gradle.gradleUserHomeDir}/wsm-local-maven")
def stagedDir = new File(localMavenRoot, "net/fabricmc/intermediary/${minecraft_version_26x}")
stagedDir.mkdirs()
def stagedJar = new File(stagedDir, "intermediary-${minecraft_version_26x}.jar")
def stagedJarV2 = new File(stagedDir, "intermediary-${minecraft_version_26x}-v2.jar")
java.nio.file.Files.copy(
    mappingsJar.toPath(),
    stagedJar.toPath(),
    java.nio.file.StandardCopyOption.REPLACE_EXISTING
)
// Also publish under the `-v2` classifier name in case Loom requests that variant.
java.nio.file.Files.copy(
    mappingsJar.toPath(),
    stagedJarV2.toPath(),
    java.nio.file.StandardCopyOption.REPLACE_EXISTING
)
def pomFile = new File(stagedDir, "intermediary-${minecraft_version_26x}.pom")
pomFile.text = """<?xml version=\"1.0\" encoding=\"UTF-8\"?>
<project xmlns=\"http://maven.apache.org/POM/4.0.0\"
         xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\"
         xsi:schemaLocation=\"http://maven.apache.org/POM/4.0.0 http://maven.apache.org/xsd/maven-4.0.0.xsd\">
    <modelVersion>4.0.0</modelVersion>
    <groupId>net.fabricmc</groupId>
    <artifactId>intermediary</artifactId>
    <version>${minecraft_version_26x}</version>
    <packaging>jar</packaging>
</project>
"""
println "[fabric-26x] staged in local maven: ${stagedDir}"

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version_26x}"
    mappings files(mappingsJar)
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_26x}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_26x}"

    implementation project(':common')
    include project(':common')
}

processResources {
    inputs.property "version", project.version
    filteringCharset "UTF-8"
    filesMatching("fabric.mod.json") { expand "version": project.version }
}

def targetJava = 25
tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release  = targetJava
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
}

jar {
    from("${rootProject.projectDir}/LICENSE") {
        rename { "${it}_${base.archivesName.get()}" }
    }
}
