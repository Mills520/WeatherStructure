plugins {
    id 'fabric-loom' version "${fabric_loom_26x}"
}

version   = "${mod_version}"
group     = maven_group
base { archivesName = "weather-structure-mod-fabric-26x" }

// ── Fabric intermediary workaround ─────────────────────────────────────────
// MC 26.x ships pre-deobfuscated (yarn was final at 1.21.11, the last
// obfuscated MC version). Mojang no longer publishes a `client_mappings`
// file, so `loom.officialMojangMappings()` fails with
//   "Failed to find official mojang mappings for 26.1.2"
//
// Fabric publishes intermediary mappings for 26.1.x, but the artifact
// ships with a stub POM whose <version> is hard-coded to 0.0.0. Gradle's
// strict module-metadata verification rejects the mismatch:
//   "inconsistent module metadata found. Descriptor: ...:0.0.0
//    Errors: bad version: expected='26.1.2' found='0.0.0'"
//
// `@jar` artifact-only notation and `metadataSources { artifact() }` on a
// dedicated repo entry both failed to suppress this — Loom's internal
// mappings resolution path appears to re-declare intermediary in a way
// that triggers POM lookup anyway.
//
// Bulletproof fix: download the jar ourselves and feed it to Loom as a
// local file dependency. `files(...)` skips every metadata mechanism.
def intermediaryDir  = file("${gradle.gradleUserHomeDir}/wsm-intermediary-cache/${minecraft_version_26x}")
def intermediaryJar  = new File(intermediaryDir, "intermediary-${minecraft_version_26x}-v2.jar")
if (!intermediaryJar.exists()) {
    intermediaryDir.mkdirs()
    // Fabric's intermediary maven layout has changed across MC versions:
    //   pre-1.21.x:  intermediary-VER-v2.jar (classifier "v2")
    //   post-1.21.x: intermediary-VER.jar    (no classifier; v2 format is default)
    // The Prism runtime log for MC 26.1.2 showed the no-classifier filename,
    // so try that first and fall back to the older classifier layout.
    def base = "https://maven.fabricmc.net/net/fabricmc/intermediary/${minecraft_version_26x}"
    def candidates = [
        "${base}/intermediary-${minecraft_version_26x}.jar",
        "${base}/intermediary-${minecraft_version_26x}-v2.jar",
    ]
    def tmp     = new File(intermediaryDir, "intermediary.jar.part")
    def errors  = []
    def sourceUrl = null
    for (url in candidates) {
        try {
            def conn = new URL(url).openConnection()
            conn.setRequestProperty('User-Agent', 'wsm-build/1.5.0')
            conn.setConnectTimeout(30_000)
            conn.setReadTimeout(60_000)
            def code = conn.getResponseCode()
            if (code != 200) {
                errors << "${code} ${url}"
                continue
            }
            println "[fabric-26x] downloading intermediary: ${url}"
            conn.inputStream.withStream { input ->
                tmp.withOutputStream { output -> output << input }
            }
            sourceUrl = url
            break
        } catch (Throwable t) {
            errors << "${t.class.simpleName}: ${t.message} (${url})"
        }
    }
    if (sourceUrl == null) {
        tmp.delete()
        throw new GradleException(
            "[fabric-26x] could not download Fabric intermediary mappings for " +
            "${minecraft_version_26x}. Tried:\n  - " + errors.join('\n  - '))
    }
    try {
        // java.nio.Files.move throws on failure (unlike File.renameTo which
        // silently returns false on Windows AV / file-lock interference).
        java.nio.file.Files.move(
            tmp.toPath(),
            intermediaryJar.toPath(),
            java.nio.file.StandardCopyOption.REPLACE_EXISTING
        )
    } catch (Throwable t) {
        tmp.delete()
        intermediaryJar.delete()
        throw new GradleException(
            "[fabric-26x] failed to install intermediary jar at " +
            "${intermediaryJar}: ${t.message}", t)
    }
    if (!intermediaryJar.exists()) {
        throw new GradleException(
            "[fabric-26x] intermediary jar missing after download: ${intermediaryJar}")
    }
    println "[fabric-26x] saved: ${intermediaryJar}"
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version_26x}"
    mappings files(intermediaryJar)
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_26x}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_26x}"

    implementation project(':common')
    include project(':common')
}

processResources {
    inputs.property "version", project.version
    filteringCharset "UTF-8"
    filesMatching("fabric.mod.json") { expand "version": project.version }
}

def targetJava = 25
tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release  = targetJava
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
}

jar {
    from("${rootProject.projectDir}/LICENSE") {
        rename { "${it}_${base.archivesName.get()}" }
    }
}
