plugins {
    id 'fabric-loom' version "${fabric_loom_26x}"
}

version   = "${mod_version}"
group     = maven_group
base { archivesName = "weather-structure-mod-fabric-26x" }

// ── Fabric intermediary workaround ─────────────────────────────────────────
// MC 26.x ships pre-deobfuscated (yarn was final at 1.21.11, the last
// obfuscated MC version). Mojang no longer publishes a `client_mappings`
// file, so `loom.officialMojangMappings()` fails with
//   "Failed to find official mojang mappings for 26.1.2"
//
// Fabric publishes intermediary mappings for 26.1.x, but the artifact
// ships with a stub POM whose <version> is hard-coded to 0.0.0. Gradle's
// strict module-metadata verification rejects the mismatch:
//   "inconsistent module metadata found. Descriptor: ...:0.0.0
//    Errors: bad version: expected='26.1.2' found='0.0.0'"
//
// `@jar` artifact-only notation and `metadataSources { artifact() }` on a
// dedicated repo entry both failed to suppress this — Loom's internal
// mappings resolution path appears to re-declare intermediary in a way
// that triggers POM lookup anyway.
//
// Bulletproof fix: download the jar ourselves and feed it to Loom as a
// local file dependency. `files(...)` skips every metadata mechanism.
def intermediaryDir  = file("${gradle.gradleUserHomeDir}/wsm-intermediary-cache/${minecraft_version_26x}")
def intermediaryJar  = new File(intermediaryDir, "intermediary-${minecraft_version_26x}-v2.jar")
if (!intermediaryJar.exists()) {
    intermediaryDir.mkdirs()
    def url = "https://maven.fabricmc.net/net/fabricmc/intermediary/${minecraft_version_26x}/intermediary-${minecraft_version_26x}-v2.jar"
    println "[fabric-26x] downloading intermediary: ${url}"
    def tmp = new File(intermediaryDir, "intermediary.jar.part")
    new URL(url).withInputStream { input ->
        tmp.withOutputStream { output -> output << input }
    }
    tmp.renameTo(intermediaryJar)
    println "[fabric-26x] saved: ${intermediaryJar}"
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version_26x}"
    mappings files(intermediaryJar)
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_26x}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_26x}"

    implementation project(':common')
    include project(':common')
}

processResources {
    inputs.property "version", project.version
    filteringCharset "UTF-8"
    filesMatching("fabric.mod.json") { expand "version": project.version }
}

def targetJava = 25
tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release  = targetJava
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
}

jar {
    from("${rootProject.projectDir}/LICENSE") {
        rename { "${it}_${base.archivesName.get()}" }
    }
}
